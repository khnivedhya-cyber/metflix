<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<title>Who's Watching?</title>

<style>
.plus{
    width:180px;
    height:180px;
    background:#2b2b2b;
    border-radius:10px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:90px;
    color:#808080;
    cursor:pointer;
    transition:.3s;
}

.plus:hover{
    background:#fff;
    color:#141414;
}
body{

margin:0;

background:#141414;

font-family:Arial;

color:white;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

flex-direction:column;

}

h1{

font-size:3rem;

margin-bottom:50px;

}

.container{

display:flex;

gap:60px;

}

.profile{

cursor:pointer;

text-align:center;

transition:.3s;

}

.profile:hover{

transform:scale(1.08);

}

.profile img{
    width:180px;
    height:180px;
    border-radius:12px;
    object-fit:cover;
    transition:.3s;
}

.profile:hover img{
    transform:scale(1.05);
    border:3px solid white;
}

.profile p{

font-size:22px;

margin-top:15px;

}

</style>

</head>

<body>

<h1>Who's Watching?</h1>

<div class="container">

<div class="profile" onclick="choose('Niveu')">
    <img src="niveu.jpeg">
    <p>Niveu</p>
</div>

<div class="profile" onclick="choose('AJ')">
    <img src="aj.jpeg">
    <p>AJ</p>
</div>

<div class="profile">
    <div class="plus" onclick="alert('Only Niveu & AJ allowed ❤️')">+</div>
    <p>Add Profile</p>
</div>

</div>

<script>

function choose(name){

localStorage.setItem("profile",name);

window.location.href="home.html";

}

</script>

</body>

</html>
